<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!--
  Kotlin (XtermTerminalView) loads this file and inlines the three tags below, so the engine needs
  no subresource fetch at all. The only external request left is the font, which is optional: if it
  fails, xterm falls back to system monospace. Tags must stay byte-identical for the splice.
-->
<link rel="stylesheet" href="xterm.css">
<style>
  @font-face { font-family: 'JBMono'; src: url('font') format('truetype'); font-display: block; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #11131a; }
  /* fixed → sized from the visual viewport, which stays correct even if the document box collapses */
  #term { position: fixed; top: 0; left: 0; right: 0; bottom: 0; padding: 8px 8px 2px 8px; }
  .xterm .xterm-viewport { overflow-y: auto; scrollbar-width: none; }
  .xterm .xterm-viewport::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
"use strict";
var bridge = window.AndroidTerminal || null;
var host = document.getElementById('term');

function log(msg) { try { console.log("OC " + msg); } catch (e) { } }

window.onerror = function (message, source, line) {
  if (bridge && bridge.onError) bridge.onError(String(message) + " @" + String(line));
  return false;
};
window.onunhandledrejection = function (e) {
  if (bridge && bridge.onError) bridge.onError("promise: " + String(e && e.reason));
};

var term = new Terminal({
  fontFamily: "'JBMono', ui-monospace, monospace",
  fontSize: 12,
  // Matches the native renderer's 16sp/12sp: powerline glyphs are taller than the cell and overlap
  // neighbouring rows at a tighter line height.
  lineHeight: 1.34,
  scrollback: 8000,
  cursorBlink: true,
  convertEol: false,
  theme: { background: '#11131a', foreground: '#e6e6e6' }
});
var fit = new FitAddon.FitAddon();
term.loadAddon(fit);

// Input: xterm handles the IME, hardware keys, paste and mouse itself.
term.onData(function (data) { if (bridge) bridge.onInput(data); });

var opened = false, started = false, wroteOnce = false;
var lastCols = 0, lastRows = 0, resizeTimer = null;

function hostReady() {
  return host && host.clientWidth >= 8 && host.clientHeight >= 8;
}

// The WebView is often laid out *after* this script runs. Opening xterm on a 0x0 element makes the
// renderer measure a bogus cell size and paint nothing, so wait for a real size before open().
function start() {
  if (opened || !hostReady()) return;
  opened = true;
  term.open(host);
  try { fit.fit(); } catch (e) { log("fit failed: " + e); }
  console.log("OC start host=" + host.clientWidth + "x" + host.clientHeight +
    " cols=" + term.cols + " rows=" + term.rows);
  started = true;
  if (bridge) bridge.onReady();
}

function doFit() {
  if (!started || !hostReady()) return;
  try { fit.fit(); } catch (e) { return; }
  if (term.cols < 2 || term.rows < 2) return;
  if (term.cols === lastCols && term.rows === lastRows) return;
  lastCols = term.cols;
  lastRows = term.rows;
  // Force a full repaint: after a resize the renderer can leave stale cells behind.
  try { term.refresh(0, term.rows - 1); } catch (e) { }
  // Debounce: the keyboard animation fires a ResizeObserver event per pixel.
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    if (bridge) bridge.onResized(term.cols, term.rows);
  }, 80);
}

if (window.ResizeObserver) new ResizeObserver(function () { start(); doFit(); }).observe(host);
window.addEventListener('resize', doFit);
window.addEventListener('orientationchange', function () { setTimeout(doFit, 300); });
// Safety net: the host can gain a size without a ResizeObserver notification reaching us.
setInterval(function () { start(); doFit(); }, 200);

// ---- Kotlin -> JS -------------------------------------------------------------------------------
// Output arrives base64-encoded so escape sequences/UTF-8 survive the bridge untouched.
function bytesOf(b64) {
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
window.__ocWrite = function (b64) {
  var text = new TextDecoder('utf-8').decode(bytesOf(b64));
  term.write(text);
  if (!wroteOnce) {
    wroteOnce = true;
    setTimeout(function () {
      console.log("OC first-write chars=" + text.length + " rows=" + term.rows);
    }, 300);
  }
};
window.__ocReset = function () {
  term.reset();
  lastCols = 0;
  lastRows = 0;
  wroteOnce = false;
};
window.__ocPaste = function (text) { term.paste(text); };
window.__ocPaste64 = function (b64) { term.paste(new TextDecoder('utf-8').decode(bytesOf(b64))); };
window.__ocTheme = function (json) {
  try {
    var t = JSON.parse(json);
    var th = {
      background: t.bg, foreground: t.fg, cursor: t.cursor, cursorAccent: t.bg,
      selectionBackground: t.selection,
    };
    for (var i = 0; i < t.names.length; i++) th[t.names[i]] = t.ansi[i];
    term.options.theme = th;
  } catch (e) { }
};
window.__ocFocus = function () { try { term.focus(); } catch (e) { } };
window.__ocCopy = function (visibleOnly) {
  var text = term.getSelection();
  if (!text) {
    var buf = term.buffer.active;
    var end = visibleOnly ? buf.viewportY + term.rows : buf.length;
    var out = [];
    for (var i = buf.viewportY; i < end; i++) {
      var line = buf.getLine(i);
      if (line) out.push(line.translateToString(true));
    }
    text = out.join('\n').replace(/\s+$/, '');
  }
  if (bridge && text) bridge.onCopy(text);
};
window.__ocBottom = function () { term.scrollToBottom(); };

// Fit only once the Nerd Font is loaded (otherwise the first layout uses fallback cell metrics).
// A font failure must not block startup, so race it against a timeout.
var fontReady = (document.fonts && document.fonts.load)
  ? document.fonts.load('12px JBMono').catch(function () { })
  : Promise.resolve();
fontReady.then(start);
setTimeout(start, 1200);
</script>
</body>
</html>
